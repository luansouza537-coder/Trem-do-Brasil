<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>

  <!-- Outer ring accent -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>

  <!-- Rail tracks (two parallel lines, perspective foreshortened) -->
  <!-- Left rail -->
  <path d="M10 52 Q20 36 32 28 Q44 36 54 52" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Right rail offset -->
  <path d="M14 54 Q23 38 32 30 Q41 38 50 54" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Sleepers (cross ties) -->
  <line x1="19" y1="45" x2="23" y2="47" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="37" x2="29" y2="39" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="35" y1="37" x2="39" y2="39" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="41" y1="45" x2="45" y2="47" stroke="#92400e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Locomotive silhouette at vanishing point -->
  <!-- Boiler body -->
  <rect x="26" y="20" width="12" height="7" rx="2" fill="#dc2626"/>
  <!-- Cab -->
  <rect x="34" y="17" width="7" height="10" rx="1.5" fill="#dc2626"/>
  <!-- Cab window -->
  <rect x="35.5" y="18.5" width="4" height="3" rx="0.8" fill="#38bdf8"/>
  <!-- Smokestack -->
  <rect x="28" y="14" width="2.5" height="6" rx="1" fill="#1e293b"/>
  <ellipse cx="29.2" cy="14" rx="2.5" ry="1.2" fill="#334155"/>
  <!-- Headlight -->
  <circle cx="41.5" cy="23" r="1.8" fill="#fef08a"/>
  <circle cx="41.5" cy="23" r="0.9" fill="#fff"/>
  <!-- Wheels -->
  <circle cx="29" cy="27.5" r="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="34" cy="27.5" r="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="39" cy="27.5" r="1.5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <!-- Steam puffs -->
  <circle cx="27" cy="10" r="2.5" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="31" cy="8"  r="2"   fill="#e2e8f0" opacity="0.45"/>
  <circle cx="23" cy="11" r="1.5" fill="#e2e8f0" opacity="0.35"/>

  <!-- "R" monogram bottom-right -->
  <text x="46" y="54" font-family="monospace" font-weight="900" font-size="11" fill="#f59e0b" opacity="0.9">R</text>
</svg>
